[ci]
platform = "github"
provider = "actions"
runtime = "nix"
runner = "ubuntu-24.04"
nix_builds = [
  ".#packages.x86_64-linux.instantclone",
  ".#checks.x86_64-linux.runtime",
  ".#checks.x86_64-linux.runtime-dual",
  ".#checks.x86_64-linux.desk",
]

[ci.nix_build]
only = true
timeout_minutes = 45
max_parallel = 2
max_jobs = 1
cores = 2
capture_results = true
artifact_retention_days = 30
extra_setup = [
  "nix run --max-jobs 1 --cores 2 github:caniko/simit/d560f909b450c629b527ee0409f2826c477a5649 -- init ci --platform github --ci-provider actions --runtime nix --check --diff",
]
post_build = ["python3 tests/managed/retain.py"]
